<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập Quản trị - ZeroTruyen</title>
    <!-- Nhúng Cloudflare bảo mật -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        body { background: #1e1e2d; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Segoe UI', sans-serif; }
        .login-box { background: #2b2b3c; padding: 40px; border-radius: 8px; width: 320px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #3a3a4c; }
        .login-box h2 { margin-top: 0; color: #f39c12; font-size: 20px; letter-spacing: 2px; margin-bottom: 25px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #444; border-radius: 4px; box-sizing: border-box; background: #1e1e2d; color: white; outline: none;}
        input:focus { border-color: #f39c12; }
        button { width: 100%; padding: 12px; background: #f39c12; color: #111; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 15px; transition: 0.2s;}
        button:hover { background: #e67e22; }
        #thongBao { color: #ff4757; font-size: 14px; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>HỆ THỐNG QUẢN TRỊ</h2>
        <input type="text" id="adTen" placeholder="Tên đăng nhập Admin">
        <input type="password" id="adPass" placeholder="Mật khẩu">
        
        <!-- Ô xác thực Cloudflare -->
        <div style="display: flex; justify-content: center; margin-bottom: 15px;">
            <div class="cf-turnstile" data-sitekey="0x4AAAAAAE8xEQkI28NABEvr"></div>
        </div>

        <button onclick="loginAdmin()">Đăng nhập Hệ thống</button>
        <p id="thongBao"></p>
    </div>
    
    <script src="js/thong-bao.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
